name: Windows installer

# Builds the all-in-one MixZhuyin installer (its own text service, launcher,
# Node.js and the input method) and tests it on Windows: a clean install,
# typing through the launcher, the settings page server, uninstalling, and
# installing over the earlier PIME add-on.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "output/pime/**"
      - "windows/**"
      - "package.json"
      - "package-lock.json"
      - "webpack.config.pime.js"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.x"
      - run: npm ci
      - run: npm run build:pime
      - name: Type through the module
        run: node windows/e2e/type_test.js
      - name: Install NSIS if missing
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis -y --no-progress
          }
      - name: Build the installer
        shell: pwsh
        run: pwsh windows/build_all_in_one.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: MixZhuyin-setup
          path: windows/build/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pime-module
          path: output/pime
          if-no-files-found: error

  clean-install:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: MixZhuyin-setup
          path: setup
      - name: Install silently
        shell: pwsh
        run: |
          $setup = Get-ChildItem setup\*.exe | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer exit code $($p.ExitCode)" }
      - name: Check the installation
        shell: pwsh
        run: windows/e2e/check_install.ps1
      - name: Type through the launcher
        shell: pwsh
        run: |
          $dir = Join-Path $env:ProgramFiles "MixZhuyin"
          if (-not (Get-Process MixZhuyinLauncher -ErrorAction SilentlyContinue)) {
            Start-Process "$dir\MixZhuyinLauncher.exe"
          }
          Start-Sleep -Seconds 3
          & "$dir\node\node.exe" windows\e2e\type_test.js --pipe
          if ($LASTEXITCODE -ne 0) { throw "Typing test failed" }
      - name: Open the settings page server
        shell: pwsh
        run: |
          $dir = Join-Path $env:ProgramFiles "MixZhuyin"
          & "$dir\node\node.exe" windows\e2e\config_tool_test.js "$dir\node\input_methods\MixZhuyin\config_tool.js"
          if ($LASTEXITCODE -ne 0) { throw "Settings page server test failed" }
      - name: Uninstall silently
        shell: pwsh
        run: |
          $dir = Join-Path $env:ProgramFiles "MixZhuyin"
          Start-Process "$dir\Uninstall.exe" -ArgumentList '/S' -Wait | Out-Null
          # The uninstaller copies itself to a temporary Au_.exe and runs from there.
          Start-Sleep -Seconds 2
          Wait-Process -Name "Au_" -Timeout 180 -ErrorAction SilentlyContinue
      - name: Check the uninstallation
        shell: pwsh
        run: windows/e2e/check_uninstall.ps1

  replace-addon:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: MixZhuyin-setup
          path: setup
      - uses: actions/download-artifact@v4
        with:
          name: pime-module
          path: pime-module
      - name: Set up PIME 2.0.0-beta4 with the MixZhuyin add-on
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v2.0.0-beta4 --repo EasyIME/PIME --pattern "*setup.exe" --dir pime
          $pimeSetup = (Get-ChildItem pime\*.exe | Select-Object -First 1).FullName
          windows/e2e/setup_pime_addon.ps1 -PimeSetup $pimeSetup -Module (Resolve-Path pime-module)
      - name: Install the all-in-one version over it
        shell: pwsh
        run: |
          $setup = Get-ChildItem setup\*.exe | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer exit code $($p.ExitCode)" }
      - name: Check the add-on was replaced
        shell: pwsh
        run: |
          windows/e2e/check_addon_removed.ps1
          windows/e2e/check_install.ps1
