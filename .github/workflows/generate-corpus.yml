name: Generate colloquial corpus

# Asks Claude for everyday Taiwanese Mandarin messages (the ANTHROPIC_API_KEY
# repository secret pays for it) and pushes them to a branch named
# data/corpus-<run number>. "Train language model" can then add the file to
# its sources (input corpus_branch).

on:
  workflow_dispatch:
    inputs:
      sentences:
        description: "Sentences to generate (bounds the API cost)"
        default: "50000"
      model:
        description: "Claude model"
        default: "claude-haiku-5-5"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install anthropic

      - name: Generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Add the ANTHROPIC_API_KEY repository secret first."
            exit 1
          fi
          mkdir -p tools/mixed/corpus
          python3 tools/mixed/generate_colloquial_corpus.py \
            --sentences "${{ inputs.sentences }}" \
            --model "${{ inputs.model }}" \
            --output tools/mixed/corpus/colloquial.txt | tee -a "$GITHUB_STEP_SUMMARY"
          { echo; echo "Sample:"; echo '```'; head -20 tools/mixed/corpus/colloquial.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Push the corpus to a branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="data/corpus-${{ github.run_number }}"
          git checkout -b "$branch"
          git add tools/mixed/corpus/colloquial.txt
          git commit -q \
            -m "feat: generate a colloquial corpus (run ${{ github.run_number }})" \
            -m "${{ inputs.sentences }} sentences from ${{ inputs.model }}." \
            -m "Generated by tools/mixed/generate_colloquial_corpus.py."
          git push origin "$branch"
