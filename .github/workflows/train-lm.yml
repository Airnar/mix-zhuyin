name: Train language model

# Trains the word-pair (bigram) model used by mixed input from Chinese
# Wikipedia, evaluates it on held-out sentences, and pushes the result to a
# branch named lm/bigram-<run number> for review.

on:
  workflow_dispatch:
    inputs:
      max_chars:
        description: "Corpus size in characters"
        default: "150000000"
      max_pairs:
        description: "Word pairs to keep"
        default: "300000"

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install opencc datasets

      - name: Train
        run: >
          python tools/mixed/train_bigram.py
          --hf-dataset wikimedia/wikipedia
          --hf-config 20231101.zh
          --max-chars "${{ inputs.max_chars }}"
          --max-pairs "${{ inputs.max_pairs }}"
          --heldout heldout.txt
          --heldout-count 2000
          --output src/MixedInput/BigramData.ts
          --source "Chinese Wikipedia (wikimedia/wikipedia, 20231101.zh)"

      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"

      - run: npm ci

      - name: Evaluate on held-out sentences
        id: evaluate
        continue-on-error: true
        run: >
          MIX_LM_EVAL=heldout.txt MIX_LM_EVAL_REPORT=lm-eval.md
          npx jest src/MixedInput/LanguageModelEval.test.ts

      - name: Report
        if: always()
        run: |
          if [ -f lm-eval.md ]; then cat lm-eval.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Push the model to a branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="lm/bigram-${{ github.run_number }}"
          git checkout -b "$branch"
          mkdir -p tools/mixed/reports
          cp lm-eval.md "tools/mixed/reports/bigram-${{ github.run_number }}.md" || true
          cp heldout.txt src/MixedInput/testdata/heldout.txt
          git add src/MixedInput/BigramData.ts src/MixedInput/testdata/heldout.txt tools/mixed/reports
          git commit -q \
            -m "feat: train bigram model (run ${{ github.run_number }})" \
            -m "Word pairs from Chinese Wikipedia, ${{ inputs.max_chars }} characters, up to ${{ inputs.max_pairs }} pairs." \
            -m "Evaluation outcome: ${{ steps.evaluate.outcome }}; see tools/mixed/reports."
          git push origin "$branch"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lm-report
          path: |
            lm-eval.md
            heldout.txt
          if-no-files-found: ignore
