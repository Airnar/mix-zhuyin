name: Train language model

# Trains the word-pair (bigram) model used by mixed input from Chinese
# Wikipedia, evaluates it on held-out sentences, and pushes the result to a
# branch named lm/bigram-<run number> for review.

on:
  workflow_dispatch:
    inputs:
      sources:
        description: "Space-separated NAME:CONFIG:CHARS Hugging Face sources"
        default: "wikimedia/wikipedia:20231101.zh:150000000 botp/yentinglin-zh_TW_c4::300000000"
      source_note:
        description: "Attribution for the generated file header"
        default: "Chinese Wikipedia (CC BY-SA 4.0) and zh_TW_c4 (ODC-BY)"
      max_pairs:
        description: "Word pairs to keep"
        default: "300000"
      max_triples:
        description: "Word triples to keep (0 = no trigram model)"
        default: "200000"
      corpus_branch:
        description: "Branch to take tools/mixed/corpus/colloquial.txt from (empty: the checked-out one)"
        default: ""
      corpus_repeat:
        description: "Times the colloquial corpus is counted"
        default: "20"

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install opencc datasets

      - name: Get the colloquial corpus
        run: |
          if [ -n "${{ inputs.corpus_branch }}" ]; then
            git fetch --depth 1 origin "${{ inputs.corpus_branch }}"
            git show FETCH_HEAD:tools/mixed/corpus/colloquial.txt > colloquial.txt
          elif [ -f tools/mixed/corpus/colloquial.txt ]; then
            cp tools/mixed/corpus/colloquial.txt colloquial.txt
          fi
          if [ -f colloquial.txt ]; then wc -l colloquial.txt; fi

      - name: Train
        run: >
          python tools/mixed/train_bigram.py
          $(for x in ${{ inputs.sources }}; do printf -- "--hf %s " "$x"; done)
          $( [ -f colloquial.txt ] && printf -- "--text-file colloquial.txt --text-repeat %s " "${{ inputs.corpus_repeat }}" )
          $( [ "${{ inputs.max_triples }}" != "0" ] && printf -- "--trigram-output src/MixedInput/TrigramData.ts --max-triples %s " "${{ inputs.max_triples }}" )
          --max-pairs "${{ inputs.max_pairs }}"
          --heldout heldout.txt
          --heldout-count 2000
          --output src/MixedInput/BigramData.ts
          --source "${{ inputs.source_note }}"

      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"

      - run: npm ci

      - name: Evaluate on held-out sentences
        id: evaluate
        continue-on-error: true
        run: >
          MIX_LM_EVAL=heldout.txt MIX_LM_EVAL_REPORT=lm-eval.md
          npx jest src/MixedInput/LanguageModelEval.test.ts

      - name: Report
        if: always()
        run: |
          if [ -f lm-eval.md ]; then cat lm-eval.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Push the model to a branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="lm/bigram-${{ github.run_number }}"
          git checkout -b "$branch"
          mkdir -p tools/mixed/reports
          cp lm-eval.md "tools/mixed/reports/bigram-${{ github.run_number }}.md" || true
          cp heldout.txt src/MixedInput/testdata/heldout.txt
          git add src/MixedInput/BigramData.ts src/MixedInput/TrigramData.ts src/MixedInput/testdata/heldout.txt tools/mixed/reports
          git commit -q \
            -m "feat: train bigram model (run ${{ github.run_number }})" \
            -m "Sources: ${{ inputs.sources }} ${{ inputs.corpus_branch }}; up to ${{ inputs.max_pairs }} pairs, ${{ inputs.max_triples }} triples." \
            -m "Evaluation outcome: ${{ steps.evaluate.outcome }}; see tools/mixed/reports."
          git push origin "$branch"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lm-report
          path: |
            lm-eval.md
            heldout.txt
          if-no-files-found: ignore
